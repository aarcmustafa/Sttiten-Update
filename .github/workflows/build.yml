name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # تفعيل الكاش لملفات البناء لتسريع المحاولات القادمة
    - name: Cache Buildozer global directory
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: buildozer-arm7-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          buildozer-arm7-

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev ccache
        pip install --upgrade pip setuptools buildozer cython==0.29.33

    - name: Accept Android SDK Licenses
      run: |
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg

    - name: Build APK with Buildozer
      env:
        ACCEPT_BUILD_TOOLS_CHECKSUM: "true"
        # توزيع جهد المعالج ومنع استهلاك الذاكرة الكلي أثناء ترجمة مكتبات C++
        MAKEFLAGS: "-j2"
      run: |
        yes | buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Sttiten-Update-ARM7-APK
        path: bin/*.apk
        
