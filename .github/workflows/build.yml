name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies & Android Licenses Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
        pip install --upgrade pip setuptools buildozer cython==0.29.33

    - name: Accept Android SDK Licenses
      run: |
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        # قبول جميع تراخيص Android SDK تلقائياً عبر الأنبوب
        yes | sdkmanager --sdk_root=$HOME/.buildozer/android/platform/android-sdk --licenses || true

    - name: Build APK with Buildozer
      env:
        # إجبار python-for-android و Buildozer على قبول التراخيص دون انتظار مدخلات
        ACCEPT_BUILD_TOOLS_CHECKSUM: "true"
      run: |
        # استخدام yes لقبول أي سؤال رخص يطرحه buildozer أثناء التجميع
        yes | buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Sttiten-Update-APK
        path: bin/*.apk
        
